<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Título y descripción: es lo que se ve en Google y al compartir el link por WhatsApp -->
  <title>PROP | Chicha morada y limonada en botella · Lima</title>
  <meta name="description" content="Chicha morada y limonada en botella de 320 ml. Precios y pedidos por WhatsApp en Lima.">
  <meta property="og:title" content="PROP | Chicha morada y limonada en botella">
  <meta property="og:description" content="Precios y pedidos por WhatsApp en Lima.">
  <meta property="og:image" content="img/chicha.webp">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#2b0f30">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232b0f30'/%3E%3Ctext x='32' y='46' font-family='Impact,Arial Black,sans-serif' font-size='40' fill='%236bd52a' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
  <link rel="preload" href="config.json" as="fetch" crossorigin>
  <link rel="preload" href="img/chicha.webp" as="image">
  <link rel="stylesheet" href="css/estilos.css">
  <script src="js/catalogo.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <header class="cabecera" id="cabecera">
    <div class="contenedor cabecera__fila">
      <a class="marca" href="#inicio" id="marca">PROP</a>
      <button class="menu-boton" id="menu-boton" aria-label="Abrir menú" aria-expanded="false" aria-controls="menu">
        <span></span><span></span><span></span>
      </button>
      <nav class="menu" id="menu" aria-label="Principal">
        <a href="#inicio">Inicio</a>
        <a href="#estrellas">Estrellas</a>
        <a href="#catalogo">Catálogo</a>
        <a href="#nosotros">Nosotros</a>
        <a href="#contacto">Contacto</a>
      </nav>
    </div>
  </header>

  <main id="contenido">
    <!-- 1. INICIO: vitrina animada con los productos estrella -->
    <section class="hero" id="inicio" aria-roledescription="carrusel" aria-label="Productos estrella">
      <div class="burbujas" id="burbujas" aria-hidden="true"></div>
      <div class="hero__palabra" id="hero-palabra" aria-hidden="true"></div>
      <div class="contenedor hero__grid">
        <div class="hero__texto" id="hero-texto">
          <p class="hero__eslogan" data-texto="negocio.eslogan"></p>
          <h1 class="hero__titulo" id="hero-titulo"></h1>
          <p class="hero__subtitulo" data-texto="inicio.subtitulo"></p>
          <div class="hero__actual" id="hero-actual" aria-live="polite"></div>
          <div class="hero__botones">
            <a class="boton boton--lima" id="hero-pedir" href="#" target="_blank" rel="noopener">Lo quiero</a>
            <a class="boton boton--borde" href="#catalogo" data-texto="inicio.botonSecundario"></a>
          </div>
        </div>
        <div class="hero__escena" id="hero-escena">
          <div class="hero__brillo" aria-hidden="true"></div>
          <div class="hero__botellas" id="hero-botellas"></div>
          <div class="hero__sombra" aria-hidden="true"></div>
        </div>
      </div>
      <div class="hero__controles" id="hero-controles"></div>
      <a class="hero__bajar" href="#estrellas" aria-label="Bajar a nuestras estrellas"><span></span></a>
    </section>

    <!-- 2. ESTRELLAS: una franja grande por cada producto estrella -->
    <section class="estrellas" id="estrellas">
      <div class="contenedor encabezado revelar">
        <h2 data-texto="estrellas.titulo"></h2>
        <p data-texto="estrellas.subtitulo"></p>
      </div>
      <div id="lista-estrellas"></div>
    </section>

    <!-- 3. CATÁLOGO con precios, pestañas y buscador -->
    <section class="seccion catalogo" id="catalogo">
      <div class="contenedor">
        <div class="encabezado revelar">
          <h2 data-texto="catalogo.titulo"></h2>
          <p data-texto="catalogo.subtitulo"></p>
        </div>
        <div class="filtros" id="filtros">
          <div class="pestanas" id="pestanas" role="tablist" aria-label="Categorías"></div>
          <label class="buscador" id="buscador" hidden>
            <span class="oculto">Buscar producto</span>
            <input type="search" id="buscar" placeholder="Buscar producto…" autocomplete="off">
          </label>
        </div>
        <div class="rejilla" id="rejilla"></div>
        <p class="vacio" id="vacio" hidden>No encontramos productos con esa búsqueda. Prueba con otra palabra.</p>
      </div>
    </section>

    <!-- 4. NOSOTROS -->
    <section class="seccion nosotros" id="nosotros">
      <div class="contenedor">
        <div class="encabezado revelar">
          <h2 data-texto="nosotros.titulo"></h2>
          <p data-texto="nosotros.texto"></p>
        </div>
        <div class="cifras" id="cifras"></div>
        <div class="ventajas" id="ventajas"></div>
        <div class="testimonios" id="testimonios"></div>
      </div>
    </section>

    <!-- 5. CONTACTO -->
    <section class="seccion contacto" id="contacto">
      <div class="contenedor">
        <div class="encabezado revelar">
          <h2 data-texto="contacto.titulo"></h2>
          <p data-texto="contacto.subtitulo"></p>
        </div>
        <div class="contacto__grid">
          <div>
            <div class="canales" id="canales"></div>
            <ul class="datos" id="datos-contacto"></ul>
            <div class="mapa" id="mapa" hidden></div>
          </div>
          <form class="formulario revelar" id="formulario" method="POST" novalidate>
            <label for="f-nombre">Nombre</label>
            <input id="f-nombre" name="nombre" type="text" autocomplete="name" required>

            <label for="f-telefono">Celular o WhatsApp</label>
            <input id="f-telefono" name="telefono" type="tel" autocomplete="tel" inputmode="tel" required>

            <label for="f-correo">Correo (opcional)</label>
            <input id="f-correo" name="email" type="email" autocomplete="email">

            <label for="f-mensaje">Mensaje</label>
            <textarea id="f-mensaje" name="mensaje" rows="4" required placeholder="Ej.: Quiero 24 botellas de chicha para un evento el sábado."></textarea>

            <!-- Campo trampa contra spam -->
            <input type="text" name="_gotcha" class="trampa" tabindex="-1" autocomplete="off" aria-hidden="true">

            <button class="boton boton--morado" type="submit">Enviar mensaje</button>
            <p class="formulario__estado" id="formulario-estado" role="status" aria-live="polite"></p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="pie">
    <div class="contenedor pie__fila">
      <p class="pie__marca">PROP</p>
      <p id="pie-texto"></p>
      <div class="redes" id="redes"></div>
    </div>
  </footer>

  <!-- Botón flotante de WhatsApp -->
  <a class="whatsapp-flotante js-whatsapp" href="#" target="_blank" rel="noopener" aria-label="Escríbenos por WhatsApp">
    <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><path fill="currentColor" d="M16 3C8.8 3 3 8.7 3 15.8c0 2.5.7 4.9 2 7L3 29l6.4-2c2 1.1 4.3 1.7 6.6 1.7 7.2 0 13-5.7 13-12.8S23.2 3 16 3zm0 23.4c-2.1 0-4.1-.6-5.9-1.7l-.4-.2-3.8 1.2 1.2-3.7-.3-.4c-1.2-1.8-1.8-3.8-1.8-5.9C5 9.9 10 5.1 16 5.1S27 9.9 27 15.8s-4.9 10.6-11 10.6zm6-7.9c-.3-.2-2-1-2.3-1.1-.3-.1-.5-.2-.8.2-.2.3-.9 1.1-1.1 1.3-.2.2-.4.2-.7.1-.3-.2-1.4-.5-2.7-1.6-1-.9-1.7-2-1.9-2.3-.2-.3 0-.5.1-.7l.5-.6c.2-.2.2-.4.3-.6.1-.2 0-.4 0-.6l-1-2.5c-.3-.7-.6-.6-.8-.6h-.7c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.8s1.2 3.2 1.4 3.5c.2.2 2.4 3.6 5.8 5 .8.3 1.4.5 1.9.7.8.3 1.5.2 2.1.1.6-.1 2-.8 2.2-1.6.3-.8.3-1.5.2-1.6-.1-.2-.3-.3-.6-.4z"/></svg>
  </a>

  <!-- Vista ampliada del producto -->
  <div class="visor" id="visor" role="dialog" aria-modal="true" aria-labelledby="visor-nombre" hidden>
    <div class="visor__fondo" data-cerrar></div>
    <div class="visor__caja" id="visor-caja">
      <button class="visor__cerrar" id="visor-cerrar" type="button" data-cerrar aria-label="Cerrar">×</button>
      <div class="visor__galeria">
        <div class="visor__pista" id="visor-pista"></div>
        <button class="visor__flecha visor__flecha--ant" id="visor-ant" type="button" aria-label="Foto anterior">‹</button>
        <button class="visor__flecha visor__flecha--sig" id="visor-sig" type="button" aria-label="Foto siguiente">›</button>
        <div class="visor__puntos" id="visor-puntos"></div>
        <p class="visor__ayuda">Toca la foto para hacer zoom</p>
      </div>
      <div class="visor__info" id="visor-info"></div>
    </div>
  </div>

  <noscript><p class="aviso">Activa JavaScript en tu navegador para ver esta página.</p></noscript>
</body>
</html>
